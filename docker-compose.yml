# jobs-app stack: Go API + browser-use worker (one image, several commands) and
# the SvelteKit UI (a second image). Data lives in ./data (gitignored) and
# persists across recreations.
#
# The API is a long-running service; the one-off jobs run against the same image
# and volume, in order:
#   docker compose run --rm app sp1500            # index companies
#   docker compose run --rm app sp1500 resolve    # careers URLs
#   docker compose run --rm app sp1500 validate   # browser-validate (optional)
#   docker compose run --rm app classify -commit  # vendor classification
#   docker compose run --rm app batch             # full scrape sweep (sequential)
#   docker compose run --rm app scrape -slug twilio -vendor eightfold   # one company
#
# ./data must be writable by PUID (default 1000): the server and every one-off
# job create and own jobs.db there. scripts/deploy.sh creates the directory and
# passes the invoking user's ids.
name: jobs

services:
  app:
    build: .
    container_name: jobs_app
    restart: unless-stopped
    # Run as the repo owner so the bind-mounted ./data is writable. deploy.sh
    # exports PUID/PGID from the invoking user; a fresh clone has no data/ dir
    # and Docker would otherwise create it owned by root, which the container
    # user (uid 1000) cannot write -> SQLite "unable to open database file (14)".
    user: "${PUID:-1000}:${PGID:-1000}"
    logging:
      # Keep logs bounded on a NAS; read them with `docker compose logs -f app`.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "8094:8080"   # API (also reached by the UI over the compose network)
    environment:
      TZ: ${TZ:-America/Chicago}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVER_ADDR: ":8080"
      DB_PATH: /data/jobs.db
      DATA_DIR: /data
      # classify requires this flag to run its browser-use render pass.
      ENABLE_BROWSER_USE: "true"
      # The model host. LAN DNS resolves ai.siggy-lab.org to the NAS's Ollama.
      OLLAMA_HOST: ${OLLAMA_HOST:-https://ai.siggy-lab.org}
      # The server spawns these to serve the per-company scrape trigger.
      BROWSER_WORKER_COMMAND: "/venv/bin/python /app/worker/browser_worker.py"
      SCRAPE_COMMAND: "/usr/local/bin/scrape"
    volumes:
      - ./data:/data
    # Chromium needs more than Docker's default 64MB /dev/shm; the browser args
    # also carry --disable-dev-shm-usage as a second line of defense.
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/runs"]
      interval: 30s
      timeout: 5s
      retries: 3

  ui:
    build: ./web
    container_name: jobs_ui
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    depends_on:
      - app
    ports:
      - "8095:8080"   # web UI: http://<nas-ip>:8095
    environment:
      NODE_ENV: production
      # adapter-node defaults to 3000; the compose port mapping and healthcheck
      # both expect 8080, so pin it.
      PORT: "8080"
      # The UI proxies /api/* to the Go API (src/routes/api/[...path]/+server.js).
      JOBS_API: http://app:8080
      TZ: ${TZ:-America/Chicago}
    healthcheck:
      # node:slim has no wget; use Node's built-in fetch instead.
      test:
        - CMD
        - node
        - -e
        - "process.exitCode=0;fetch('http://127.0.0.1:8080/').then(r=>process.exitCode=r.ok?0:1).catch(()=>process.exitCode=1)"
      interval: 30s
      timeout: 5s
      retries: 3
