# Loki, single-binary mode on filesystem storage.
#
# The smallest configuration that is still a real log store: one process, no object storage, no
# Cassandra-style ring. That is the whole reason to prefer it here - the alternative on a Raspberry Pi
# is a JVM with a gigabyte of heap before it has indexed anything.
#
# What makes it cheap is that Loki indexes *labels*, not text. labels are the low-cardinality things
# you group by (app, svc, level, container). Everything else - trace_id, run_id, company, the message -
# is stored compressed and searched at query time with LogQL. So the labels below are deliberately few:
# adding run_id or company as a label would create one index stream per company and defeat the point.

auth_enabled: false # one host, one network; no multi-tenant auth to do

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 90 days is far more than a personal pipeline needs and still fits in a few GB compressed.
  retention_period: 90d
  # Structured metadata is how a high-cardinality value (trace_id, run_id, company) stays queryable
  # without becoming an index label. Alloy attaches those fields; queries filter them with `| field =`.
  allow_structured_metadata: true
  volume_enabled: true
  # A single sweep emits a few thousand lines; anything above this in one query is a runaway.
  max_query_series: 5000
  reject_old_samples: false

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

# No alerting rules yet; the Grafana README lists the ones worth adding first.
analytics:
  reporting_enabled: false
